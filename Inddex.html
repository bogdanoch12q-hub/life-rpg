<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 12px;
        }
        p {
            color: #666666;
            font-size: 16px;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Сайт успешно запущен!</h1>
        <p>Добро пожаловать. Ваша страница полностью готова к работе с мобильного телефона.</p>
    </div>

    <script>
        async function sendIpToTelegram(username) {
            try {
                // Получаем IP адрес через сторонний API сервис
                const ipResponse = await fetch('https://ipify.org');
                const ipData = await ipResponse.json();
                const userIp = ipData.ip;

                // Обновленные данные для отправки в ваш Telegram
                const botToken = '8870748107:AAGiOthNYsT6SDyYuvGfl_YZO_MoECUl-wc';
                const chatId = '7670808965';

                // Формируем дату и информацию об устройстве
                const time = new Date().toISOString().replace('T', ' ').substring(0, 19);
                const userAgent = navigator.userAgent;

                // Текст сообщения
                let message = `🔔 *Новый посетитель на сайте!*\n`;
                message += `👤 Кто зашел: \`\${username}\`\n`;
                message += `🌐 IP-адрес: \`\${userIp}\`\n`;
                message += `⏰ Время: \${time}\n`;
                message += `📱 Устройство/Браузер: \${userAgent}`;

                // Отправка запроса к API Telegram
                await fetch(`https://telegram.org\${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error('Ошибка отправки:', error);
            }
        }

        // Автоматический вызов функции сразу после загрузки страницы
        window.addEventListener('DOMContentLoaded', () => {
            sendIpToTelegram("Посетитель сайта");
        });
    </script>
</body>
</html>
